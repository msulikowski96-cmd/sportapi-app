<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ekstraklasa – jak grają drużyny</title>
<meta name="description" content="Wyniki na żywo, tabela i profile gry drużyn Ekstraklasy: styl, mocne i słabe strony.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0f14; --s1:#121920; --s2:#19222c; --line:#232f3d; --txt:#e8eef5; --mut:#8a9ab0; --acc:#34d399; --acc2:#fbbf24; --red:#f87171; --blue:#60a5fa;
    --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  body { margin:0; font-family:var(--body); font-size:15px; line-height:1.45; background:var(--bg); color:var(--txt);
    background-image:radial-gradient(900px 400px at 50% -120px, rgba(52,211,153,.10), transparent); background-repeat:no-repeat; padding-bottom:calc(76px + env(safe-area-inset-bottom)); }
  h1,h2,h3,.num { font-family:var(--head); font-weight:600; letter-spacing:.01em; }
  header { display:flex; align-items:center; gap:10px; padding:16px 18px 6px; max-width:880px; margin:0 auto; }
  .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#34d399,#0f766e); display:grid; place-items:center; font-size:19px; }
  header h1 { margin:0; font-size:26px; line-height:1; text-transform:uppercase; } header h1 small { display:block; font-family:var(--body); font-size:11px; font-weight:500; color:var(--mut); text-transform:none; letter-spacing:.02em; margin-top:3px; }
  main { max-width:880px; margin:0 auto; padding:10px 16px 24px; }
  nav { position:fixed; left:0; right:0; bottom:0; z-index:20; background:rgba(11,15,20,.92); backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; justify-content:space-around; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav button { flex:1; max-width:120px; background:none; border:0; color:var(--mut); font:500 11px var(--body); display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; cursor:pointer; border-radius:12px; }
  nav button svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  nav button.on { color:var(--acc); } nav button:active { background:var(--s1); }
  @media (min-width:760px) { body { padding-bottom:0; } nav { position:sticky; top:0; bottom:auto; border-top:0; border-bottom:1px solid var(--line); justify-content:center; gap:6px; padding:6px; }
    nav button { flex-direction:row; max-width:none; flex:0 0 auto; font-size:14px; padding:9px 16px; } header { padding-bottom:14px; } }
  .mut { color:var(--mut); } .err { color:var(--red); } .mini { font-size:12px; color:var(--mut); } .ok { color:var(--acc); } .bad { color:var(--red); }
  h2 { font-size:22px; margin:22px 0 10px; } h3 { margin:20px 0 8px; font-size:13px; color:var(--mut); text-transform:uppercase; letter-spacing:.08em; font-family:var(--body); font-weight:600; }
  .card { background:var(--s1); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .nm { background:var(--s1); border:1px solid var(--line); border-left:3px solid var(--acc2); border-radius:10px; padding:10px 12px; margin:8px 0 12px; font-size:13px; color:var(--mut); }
  .btn { background:var(--s2); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:10px 16px; font:500 14px var(--body); cursor:pointer; }
  .btn:hover { border-color:var(--acc); } .btn.pri { background:var(--acc); color:#04251a; border-color:var(--acc); font-weight:600; } .btn:disabled { opacity:.45; cursor:default; }
  .back { margin:4px 0 12px; display:inline-flex; gap:6px; }
  .bd { flex:none; display:inline-grid; place-items:center; border-radius:50%; font-family:var(--head); font-weight:700; color:#fff; letter-spacing:.02em;
    background:linear-gradient(145deg,hsl(var(--h) 55% 42%),hsl(var(--h) 60% 26%)); box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18); }
  .day { color:var(--mut); font-size:12px; font-weight:600; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.08em; }
  .m { display:grid; grid-template-columns:54px 1fr auto; gap:10px; align-items:center; background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:11px 14px; margin-bottom:8px; cursor:pointer; transition:.15s; }
  .m:hover { border-color:rgba(52,211,153,.5); transform:translateY(-1px); }
  .m .tm { font-family:var(--head); font-size:17px; color:var(--mut); text-align:center; line-height:1.1; } .m .tm.live { color:var(--red); } .m .tm.live::before { content:""; display:block; width:7px; height:7px; border-radius:50%; background:var(--red); margin:0 auto 4px; animation:pulse 1.4s infinite; }
  @keyframes pulse { 50% { opacity:.25; } }
  .m .tt { display:flex; align-items:center; gap:9px; padding:3px 0; font-weight:500; } .m .sc { text-align:right; font-family:var(--head); font-size:21px; font-weight:700; min-width:24px; } .m .sc div { padding:3px 0; line-height:1.2; }
  .pills { display:flex; gap:6px; overflow-x:auto; margin:6px -16px 12px; padding:0 16px; scrollbar-width:none; } .pills::-webkit-scrollbar { display:none; }
  .pills button { background:var(--s1); color:var(--mut); border:1px solid var(--line); border-radius:99px; padding:7px 14px; font:500 13px var(--body); white-space:nowrap; cursor:pointer; }
  .pills button.on { color:#04251a; background:var(--acc); border-color:var(--acc); font-weight:600; }
  .bar { display:flex; align-items:center; justify-content:space-between; margin:6px 0 14px; } .bar b { font-family:var(--head); font-size:24px; }
  .bar button { width:42px; height:42px; border-radius:12px; background:var(--s1); border:1px solid var(--line); color:var(--txt); font-size:20px; cursor:pointer; } .bar button:disabled { opacity:.3; }
  table { width:100%; border-collapse:collapse; font-size:14px; } th { color:var(--mut); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.06em; text-align:center; padding:6px 3px; }
  td { padding:10px 3px; text-align:center; border-top:1px solid var(--line); } td.t { text-align:left; font-weight:500; } th.t { text-align:left; } td.pos { color:var(--mut); width:26px; font-family:var(--head); font-size:16px; } td.pts { font-family:var(--head); font-size:18px; font-weight:700; }
  td .tn { display:flex; align-items:center; gap:8px; }
  tr.z1 td.pos { box-shadow:inset 3px 0 var(--acc); } tr.z2 td.pos { box-shadow:inset 3px 0 var(--blue); } tr.z3 td.pos { box-shadow:inset 3px 0 var(--acc2); } tr.zr td.pos { box-shadow:inset 3px 0 var(--red); }
  tr.click { cursor:pointer; } tr.click:hover td.t { color:var(--acc); }
  .ld { display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center; padding:10px 2px; border-top:1px solid var(--line); } .ld:first-child { border-top:0; } .ld .r { font-family:var(--head); color:var(--mut); font-size:18px; } .ld b { font-family:var(--head); font-size:24px; }
  .prog { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin:10px 0; } .prog i { display:block; height:100%; background:var(--acc); transition:width .4s; }
  .big { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; text-align:center; } .big .n { font-family:var(--head); font-size:21px; font-weight:600; line-height:1.15; } .big .t { display:flex; flex-direction:column; align-items:center; gap:8px; } .big .s { font-family:var(--head); font-size:44px; font-weight:700; line-height:1; }
  .sub { text-align:center; color:var(--mut); font-size:13px; margin:10px 0 4px; }
  .inc { display:grid; grid-template-columns:1fr 46px 1fr; gap:6px; font-size:14px; padding:5px 0; border-top:1px solid var(--line); } .inc .h { text-align:right; } .inc .mn { text-align:center; color:var(--mut); font-family:var(--head); font-size:16px; }
  .st { margin:11px 0; font-size:13px; } .st .l { display:flex; justify-content:space-between; margin-bottom:4px; } .st .b { display:flex; height:6px; background:var(--blue); border-radius:3px; overflow:hidden; } .st .b i { background:var(--acc); display:block; }
  .lu { display:grid; grid-template-columns:1fr 1fr; gap:14px; font-size:13px; } .lu div div { padding:3px 0; } .lu .no { color:var(--mut); display:inline-block; width:24px; font-family:var(--head); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:600px) { .grid2.stack { grid-template-columns:1fr; } }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0; } .chip { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-family:var(--head); font-weight:700; font-size:16px; color:#fff; }
  .chip.Z { background:#16a34a; } .chip.R { background:#64748b; } .chip.P { background:#dc2626; }
  .tag { display:inline-block; font-size:12px; font-weight:500; padding:4px 10px; border-radius:99px; background:rgba(52,211,153,.12); color:var(--acc); border:1px solid rgba(52,211,153,.3); margin:0 6px 6px 0; }
  .tag.inj { background:rgba(248,113,113,.12); color:#fca5a5; border-color:rgba(248,113,113,.3); } .tag.sus { background:rgba(251,191,36,.12); color:#fcd34d; border-color:rgba(251,191,36,.3); }
  .hero { display:flex; gap:14px; align-items:center; } .hero h2 { margin:0; font-size:30px; line-height:1.05; }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; } .kpi { background:var(--s2); border-radius:12px; padding:9px 6px; text-align:center; } .kpi b { display:block; font-family:var(--head); font-size:22px; line-height:1.1; } .kpi span { font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; }
  .sw { list-style:none; margin:0; padding:0; } .sw li { padding:9px 0 9px 26px; position:relative; font-size:14px; border-top:1px solid var(--line); } .sw li:first-child { border-top:0; } .sw li::before { position:absolute; left:2px; top:9px; font-weight:700; }
  .sw.g li::before { content:"▲"; color:var(--acc); } .sw.w li::before { content:"▼"; color:var(--red); } .sw li small { display:block; color:var(--mut); font-size:12px; }
  .mr { padding:8px 0; border-top:1px solid var(--line); } .mr:first-of-type { border-top:0; } .mt { display:flex; justify-content:space-between; gap:10px; font-size:14px; } .mt b { font-family:var(--head); font-size:19px; }
  .mbar { height:6px; background:var(--s2); border-radius:3px; margin:5px 0 3px; overflow:hidden; } .mbar i { display:block; height:100%; border-radius:3px; background:var(--blue); } .mbar.g i { background:var(--acc); } .mbar.m i { background:var(--acc2); } .mbar.b i { background:var(--red); }
  .ml { display:flex; justify-content:space-between; font-size:11px; color:var(--mut); }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--mut); margin-top:6px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .stack1 { display:flex; height:16px; border-radius:8px; overflow:hidden; margin:8px 0; } .stack1 i { display:block; height:100%; }
  .pl { display:grid; grid-template-columns:28px 1fr auto; gap:8px; font-size:14px; padding:7px 0; border-top:1px solid var(--line); } .pl .v { color:var(--mut); font-size:13px; }
  .ai h4 { margin:14px 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--acc); font-family:var(--body); } .ai p { margin:0; font-size:14.5px; } .ai ul { margin:0; padding-left:18px; font-size:14px; } .ai li { margin:3px 0; }
  .cmp { display:grid; grid-template-columns:1fr 1.5fr 1fr; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px; } .cmp .lab { text-align:center; color:var(--mut); font-size:12px; }
  .cmp .v { font-family:var(--head); font-size:19px; font-weight:600; } .cmp .v.l { text-align:left; } .cmp .v.r { text-align:right; } .cmp .w { color:var(--acc); }
  .cmp .bars { display:flex; height:6px; gap:3px; margin-top:4px; } .cmp .bars div { flex:1; background:var(--s2); border-radius:3px; display:flex; } .cmp .bars div:first-child { justify-content:flex-end; } .cmp .bars i { display:block; height:100%; border-radius:3px; background:var(--blue); } .cmp .bars i.w { background:var(--acc); }
  select { width:100%; background:var(--s2); color:var(--txt); border:1px solid var(--line); border-radius:12px; padding:11px; font:500 15px var(--body); }
  .row2 { display:flex; gap:10px; align-items:center; } .row2 select { flex:1; min-width:0; }
  .vs { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; font-size:14px; padding:6px 0; border-top:1px solid var(--line); } .vs .mid { font-family:var(--head); font-size:18px; text-align:center; min-width:60px; }
  .hello { padding:6px 2px 2px; color:var(--mut); font-size:14px; }
</style>
</head>
<body>
<header><div class="logo">⚽</div><h1>Ekstraklasa<small>jak grają drużyny: styl, mocne i słabe strony</small></h1></header>
<nav id="nav">
  <button data-v="live" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/></svg>Na żywo</button>
  <button data-v="round"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Mecze</button>
  <button data-v="table"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Tabela</button>
  <button data-v="teams"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.500-3 7.500-7 9-4-1.500-7-4.500-7-9V6z"/></svg>Drużyny</button>
  <button data-v="cmp"><svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4"/></svg>Porównaj</button>
</nav>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s), app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtTime = (t) => new Date(t * 1000).toLocaleTimeString("pl-PL", { hour:"2-digit", minute:"2-digit" });
const fmtDay = (t) => new Date(t * 1000).toLocaleDateString("pl-PL", { weekday:"long", day:"numeric", month:"long" });
let view = "live", round = null, maxRound = 34, curRound = null, timer = null, tabMode = "all", cmpA = null, cmpB = null;

async function api(p) {
  const r = await fetch(p); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || j.message || `Błąd ${r.status}`);
  return j;
}
const note = (d) => (d && d.note ? `<div class="nm">${esc(d.note)}</div>` : "");
const loading = (t = "Ładowanie…") => { app.innerHTML = `<p class="mut">${t}</p>`; };
const fail = (e) => { app.innerHTML = `<p class="err">${esc(e.message)}</p>`; };
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = (n) => String(n).replace(/[^\p{L} ]/gu, "").split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const badge = (n, sz = 28) => `<span class="bd" style="--h:${hue(n)};width:${sz}px;height:${sz}px;font-size:${Math.round(sz * 0.4)}px">${esc(initials(n))}</span>`;
const fmtV = (f, x) => x == null ? "–" : f === "pct" ? `${Math.round(x * 10) / 10}%` : f === "n0" ? String(Math.round(x * 10) / 10) : f === "n1" ? (Math.round(x * 10) / 10).toFixed(1) : (Math.round(x * 100) / 100).toFixed(2);
const mlnE = (v) => v == null ? "–" : v >= 1e6 ? (Math.round(v / 1e5) / 10) + " mln €" : Math.round(v / 1e3) + " tys. €";

function matchRow(e) {
  const st = e.status?.type, live = st === "inprogress", sc = live || st === "finished";
  const d = e.status?.description || "";
  const left = live ? (/^[~\d]|przerwa/.test(d) ? d : "LIVE") : st === "finished" ? "KON." : fmtTime(e.startTimestamp);
  return `<div class="m" data-id="${e.id}"><div class="tm ${live ? "live" : ""}">${left}</div>
    <div><div class="tt">${badge(e.homeTeam?.name, 24)}${esc(e.homeTeam?.name)}</div><div class="tt">${badge(e.awayTeam?.name, 24)}${esc(e.awayTeam?.name)}</div></div>
    <div class="sc">${sc ? `<div>${e.homeScore?.current ?? "-"}</div><div>${e.awayScore?.current ?? "-"}</div>` : ""}</div></div>`;
}
function bindRows() { document.querySelectorAll(".m[data-id]").forEach((el) => el.onclick = () => openMatch(el.dataset.id)); }
function listByDay(events) {
  let html = "", day = "";
  for (const e of [...events].sort((a, b) => a.startTimestamp - b.startTimestamp)) {
    const d = fmtDay(e.startTimestamp);
    if (d !== day) { day = d; html += `<div class="day">${esc(d)}</div>`; }
    html += matchRow(e);
  }
  return html;
}

async function showLive(silent) {
  if (!silent) loading();
  try {
    const lv = await api("/api/live"), ev = lv.events;
    let html = note(lv);
    if (ev.length) html += `<div class="day">Trwające mecze</div>` + ev.map(matchRow).join("");
    else {
      html += `<p class="hello">Teraz nie trwa żaden mecz. Najbliższa kolejka:</p>`;
      try {
        const rs = await api("/api/rounds"); curRound = rs.currentRound?.round || 1; maxRound = rs.rounds?.length || 34;
        if (round === null) round = curRound;
        const rd = await api(`/api/round/${curRound}`); html += listByDay(rd.events);
      } catch {}
    }
    app.innerHTML = html + `<p class="mini" style="margin-top:14px">Strona odświeża się sama, gdy trwa mecz. Minuta jest szacowana (~), bo źródło danych jej nie podaje.</p>`;
    bindRows();
    clearInterval(timer);
    if (view === "live") timer = setInterval(() => { if (!document.hidden && view === "live") showLive(true); }, ev.length ? 60000 : 300000);
  } catch (e) { if (!silent) fail(e); }
}

async function showRound() {
  loading();
  try {
    if (round === null) { const r = await api("/api/rounds"); curRound = r.currentRound?.round || 1; maxRound = r.rounds?.length || 34; round = curRound; }
    const rd = await api(`/api/round/${round}`), ev = rd.events || [];
    app.innerHTML = note(rd) + `<div class="bar"><button id="pr" ${round <= 1 ? "disabled" : ""}>‹</button><b>Kolejka ${round}</b><button id="nx" ${round >= maxRound ? "disabled" : ""}>›</button></div>` + (ev.length ? listByDay(ev) : `<p class="mut">Brak meczów.</p>`);
    $("#pr").onclick = () => { if (round > 1) { round--; showRound(); } };
    $("#nx").onclick = () => { if (round < maxRound) { round++; showRound(); } };
    bindRows();
  } catch (e) { showDay(e.message); }
}
let dayOff = 0;
async function showDay(why) {
  const ds = new Date(Date.now() + dayOff * 86400000).toLocaleDateString("sv-SE");
  loading();
  try {
    const ev = (await api(`/api/day/${ds}`)).events;
    app.innerHTML = `<div class="nm">Tryb zastępczy (API-Football): ${esc(why || "")}<br>Dostępne są tylko mecze z wczoraj, dziś i jutra.</div>
      <div class="bar"><button id="pd" ${dayOff <= -1 ? "disabled" : ""}>‹</button><b>${["Wczoraj", "Dziś", "Jutro"][dayOff + 1]}</b><button id="nd" ${dayOff >= 1 ? "disabled" : ""}>›</button></div>` + (ev.length ? listByDay(ev) : `<p class="mut">Brak meczów Ekstraklasy tego dnia.</p>`);
    $("#pd").onclick = () => { dayOff--; showDay(why); }; $("#nd").onclick = () => { dayOff++; showDay(why); }; bindRows();
  } catch (e2) { app.innerHTML = `<p class="err">${esc(why || e2.message)}</p><p class="mini">Tryb zastępczy też niedostępny: ${esc(e2.message)}</p>`; }
}

const TAB_MODES = [["all", "Ogółem"], ["home", "U siebie"], ["away", "Na wyjeździe"], ["form", "Forma (5)"], ["scorers", "Strzelcy"], ["assists", "Asysty"], ["cards", "Kartki"]];
const pills = () => `<div class="pills">${TAB_MODES.map(([k, t]) => `<button data-m="${k}" class="${k === tabMode ? "on" : ""}">${t}</button>`).join("")}</div>`;
function bindPills() { document.querySelectorAll(".pills button").forEach((b) => b.onclick = () => { tabMode = b.dataset.m; showTable(); }); }
async function showTable() {
  clearTimeout(timer); clearInterval(timer); timer = null;
  if (["scorers", "assists", "cards"].includes(tabMode)) return showLeaders();
  loading();
  try {

const ul = (a) => `<ul>${(a || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
async function runAi(id) {
  const box = $("#aibox"); box.innerHTML = `<h3 style="margin-top:0">Opis stylu gry</h3><p class="mut">Model analizuje statystyki drużyny… (do ok. 45 s)</p>`;
  try {
    const d = await api(`/api/profile-ai/${id}`), a = d.ai;
    if (!a) { box.innerHTML = `<h3 style="margin-top:0">Opis stylu gry</h3><p style="white-space:pre-wrap;font-size:14px">${esc(d.raw || "Brak odpowiedzi")}</p>`; return; }
    box.innerHTML = `<h3 style="margin-top:0">Opis stylu gry</h3><p><b>${esc(a.w_skrocie)}</b></p><h4>Styl</h4><p>${esc(a.styl_gry)}</p><h4>Atak</h4><p>${esc(a.jak_atakuje)}</p><h4>Obrona</h4><p>${esc(a.jak_sie_broni)}</p>
      <h4>Mocne strony</h4>${ul(a.mocne_strony)}<h4>Słabe strony</h4>${ul(a.slabe_strony)}${a.kluczowi_zawodnicy?.length ? `<h4>Kluczowi zawodnicy</h4>${ul(a.kluczowi_zawodnicy)}` : ""}${a.na_co_zwrocic_uwage?.length ? `<h4>Na co zwrócić uwagę</h4>${ul(a.na_co_zwrocic_uwage)}` : ""}
      <p class="mini" style="margin-top:12px">Opis wygenerował model AI (${esc(String(d.model).split("/")[1])}) wyłącznie na podstawie statystyk z sezonu. To interpretacja danych, nie ocena ostateczna.</p>`;
  } catch (e) { box.innerHTML = `<h3 style="margin-top:0">Opis stylu gry</h3><p class="err">${esc(e.message)}</p><button class="btn" id="aigo">Spróbuj ponownie</button>`; $("#aigo").onclick = () => runAi(id); }
}

async function showCompare() {
  loading();
  try {
    const P = await api("/api/profiles");
    if (!P.ready) { app.innerHTML = `<div class="card"><b>Liczę profile drużyn z ${P.progress.total} meczów…</b><div class="prog"><i style="width:${Math.round((P.progress.done / (P.progress.total || 1)) * 100)}%"></i></div></div>`; timer = setTimeout(() => { if (view === "cmp") showCompare(); }, 2500); return; }
    const teams = [...P.teams].sort((a, b) => a.name.localeCompare(b.name, "pl"));
    cmpA = cmpA && teams.some((t) => t.id === cmpA) ? cmpA : teams[0].id; cmpB = cmpB && teams.some((t) => t.id === cmpB) ? cmpB : teams[1].id;
    const opt = (sel) => teams.map((t) => `<option value="${t.id}" ${t.id === sel ? "selected" : ""}>${esc(t.name)}</option>`).join("");
    app.innerHTML = `<p class="hello">Zestaw dwie drużyny i zobacz, czym się różnią w grze.</p><div class="card"><div class="row2"><select id="ca">${opt(cmpA)}</select><span class="mut">vs</span><select id="cb">${opt(cmpB)}</select></div></div><div id="cres"></div>`;
    const sw = (T) => `<h3 style="margin-top:0;color:var(--acc)">${esc(T.name)} – mocne</h3><ul class="sw g">${T.strengths.slice(0, 3).map((s) => `<li>${esc(s.split(" — ")[0])}</li>`).join("") || "<li>–</li>"}</ul><h3 style="color:var(--red)">Słabe</h3><ul class="sw w">${T.weaknesses.slice(0, 3).map((s) => `<li>${esc(s.split(" — ")[0])}</li>`).join("") || "<li>–</li>"}</ul>`;
    const draw = () => { cmpA = $("#ca").value; cmpB = $("#cb").value; const A = teams.find((t) => t.id === cmpA), B = teams.find((t) => t.id === cmpB);
      const gr = {}; for (const df of P.defs) (gr[df.group] ||= []).push(df);
      $("#cres").innerHTML = `<div class="card"><div class="big"><div class="t">${badge(A.name, 48)}<div class="n">${esc(A.name)}</div></div><div class="s" style="font-size:22px;color:var(--mut)">vs</div><div class="t">${badge(B.name, 48)}<div class="n">${esc(B.name)}</div></div></div>
        <div class="grid2" style="margin-top:10px"><div>${A.tags.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</div><div style="text-align:right">${B.tags.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</div></div></div>`
        + Object.entries(gr).map(([g, ds]) => `<div class="card"><h3 style="margin-top:0">${esc(g)}</h3>${cmpRows(ds, A, B)}</div>`).join("")
        + `<div class="grid2 stack"><div class="card">${sw(A)}</div><div class="card">${sw(B)}</div></div><p class="mini">Zielona wartość = lepszy wynik w kategorii (cechy stylu, np. posiadanie, bez oceny). Średnie z meczów sezonu.</p>`; };
    $("#ca").onchange = draw; $("#cb").onchange = draw; draw();
  } catch (e) { fail(e); }
}

function go(v) {
  view = v; clearInterval(timer); clearTimeout(timer); timer = null;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  window.scrollTo({ top: 0 });
  ({ live: showLive, round: showRound, table: showTable, teams: showTeams, cmp: showCompare }[v] || showTable)();
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => go(b.dataset.v));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
go("live");
</script>
</body>
</html>
