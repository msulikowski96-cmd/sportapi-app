<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mecze i szczegóły</title>
<style>
  :root { --bg:#0f1420; --card:#1a2133; --line:#2a3550; --txt:#e8ecf5; --mut:#8b97b3; --acc:#3b82f6; --live:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  h1 { margin:0 0 12px; font-size:20px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  select, input, button { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:14px; }
  button { cursor:pointer; } button.p { background:var(--acc); border-color:var(--acc); }
  main { max-width:900px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .league { color:var(--mut); font-size:12px; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .match { display:grid; grid-template-columns:52px 1fr auto; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; cursor:pointer; }
  .match:hover { border-color:var(--acc); }
  .time { color:var(--mut); font-size:13px; } .time.live { color:var(--live); font-weight:700; }
  .teams div { padding:1px 0; } .score { text-align:right; font-weight:700; min-width:24px; }
  .score div { padding:1px 0; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .big { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; text-align:center; margin:8px 0 16px; }
  .big .n { font-size:18px; font-weight:600; } .big .s { font-size:34px; font-weight:800; }
  dl { display:grid; grid-template-columns:150px 1fr; gap:6px 12px; margin:0; font-size:14px; }
  dt { color:var(--mut); } dd { margin:0; }
  .err { color:#fca5a5; } .mut { color:var(--mut); }
  details { margin-top:12px; } pre { overflow:auto; font-size:12px; background:#0b101a; padding:10px; border-radius:8px; }
</style>
</head>
<body>
<header>
  <h1>⚽ Mecze i szczegóły wydarzeń</h1>
  <div class="row">
    <select id="sport">
      <option value="football">Piłka nożna</option>
      <option value="basketball">Koszykówka</option>
      <option value="tennis">Tenis</option>
      <option value="ice-hockey">Hokej</option>
      <option value="american-football">Futbol amerykański</option>
      <option value="baseball">Baseball</option>
    </select>
    <input type="date" id="date">
    <button class="p" id="load">Mecze z dnia</button>
    <button id="live">🔴 Na żywo</button>
    <input id="eid" placeholder="ID wydarzenia" inputmode="numeric" style="width:140px">
    <button id="byid">Szczegóły</button>
  </div>
</header>
<main>
  <section id="detail"></section>
  <section id="list"><p class="mut">Wybierz dzień albo „Na żywo”, potem kliknij mecz.</p></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
$("date").value = new Date().toISOString().slice(0, 10);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const hhmm = (ts) => ts ? new Date(ts * 1000).toLocaleTimeString("pl-PL", { hour: "2-digit", minute: "2-digit" }) : "";

async function api(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || j.message || `Błąd ${r.status}`);
  return j;
}

function renderList(events) {
  if (!events?.length) { $("list").innerHTML = '<p class="mut">Brak meczów.</p>'; return; }
  const groups = {};
  for (const e of events) {
    const key = `${e.tournament?.category?.name ?? ""} · ${e.tournament?.name ?? "Inne"}`;
    (groups[key] ||= []).push(e);
  }
  let html = "";
  for (const [league, evs] of Object.entries(groups)) {
    html += `<div class="league">${esc(league)}</div>`;
    for (const e of evs.sort((a, b) => a.startTimestamp - b.startTimestamp)) {
      const live = e.status?.type === "inprogress";
      const st = e.status?.type;
      const left = live ? "LIVE" : st === "finished" ? "KON." : hhmm(e.startTimestamp);
      const showScore = st === "inprogress" || st === "finished";
      html += `<div class="match" data-id="${e.id}">
        <div class="time ${live ? "live" : ""}">${left}</div>
        <div class="teams"><div>${esc(e.homeTeam?.name)}</div><div>${esc(e.awayTeam?.name)}</div></div>
        <div class="score">${showScore ? `<div>${e.homeScore?.current ?? "-"}</div><div>${e.awayScore?.current ?? "-"}</div>` : ""}</div>
      </div>`;
    }
  }
  $("list").innerHTML = html;
  document.querySelectorAll(".match").forEach((el) => el.onclick = () => showEvent(el.dataset.id));
}

async function loadList(path) {
  $("list").innerHTML = '<p class="mut">Ładowanie…</p>';
  try { renderList((await api(path)).events); }
  catch (e) { $("list").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function showEvent(id) {
  $("detail").innerHTML = '<div class="panel mut">Ładowanie szczegółów…</div>';
  window.scrollTo({ top: 0, behavior: "smooth" });
  try {
    const e = (await api(`/api/event/${id}`)).event;
    const rows = [
      ["Rozgrywki", `${e.tournament?.category?.name ?? ""} – ${e.tournament?.name ?? ""}`],
      ["Sezon", e.season?.name],
      ["Runda", e.roundInfo?.name || e.roundInfo?.round],
      ["Status", e.status?.description],
      ["Start", e.startTimestamp ? new Date(e.startTimestamp * 1000).toLocaleString("pl-PL") : ""],
      ["Stadion", e.venue?.stadium?.name || e.venue?.name],
      ["Miasto", e.venue?.city?.name],
      ["Sędzia", e.referee?.name],
      ["Widzów", e.attendance],
      ["Wynik do przerwy", e.homeScore?.period1 != null ? `${e.homeScore.period1}:${e.awayScore?.period1}` : ""],
    ].filter(([, v]) => v !== "" && v != null && v !== undefined);
    $("detail").innerHTML = `<div class="panel">
      <div class="big">
        <div class="n">${esc(e.homeTeam?.name)}</div>
        <div class="s">${e.homeScore?.current ?? "-"} : ${e.awayScore?.current ?? "-"}</div>
        <div class="n">${esc(e.awayTeam?.name)}</div>
      </div>
      <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
      <details><summary class="mut">Surowa odpowiedź API</summary><pre>${esc(JSON.stringify(e, null, 2))}</pre></details>
    </div>`;
  } catch (err) {
    $("detail").innerHTML = `<div class="panel err">${esc(err.message)}</div>`;
  }
}

$("load").onclick = () => loadList(`/api/scheduled/${$("sport").value}/${$("date").value}`);
$("live").onclick = () => loadList(`/api/live/${$("sport").value}`);
$("byid").onclick = () => { const v = $("eid").value.trim(); if (v) showEvent(v); };
</script>
</body>
</html>
