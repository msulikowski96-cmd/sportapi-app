  .sin svg { flex:none; color:var(--mut); } .sin input { flex:1; min-width:0; background:none; border:0; color:var(--txt); font:600 18px var(--f); outline:none; padding:8px 0; }
  .sin input::-webkit-search-cancel-button { display:none; } .sin input::placeholder { color:var(--mut); font-weight:500; } .sin .x { background:transparent; border:1.5px solid var(--line); color:var(--txt); border-radius:50%; width:36px; height:36px; flex:none; cursor:pointer; }
  .sres { max-width:720px; margin:0 auto; padding:4px 16px 40px; } .sres .sim { cursor:pointer; } .sres .sim:hover .sn { color:var(--acc); }
  .sheet { z-index:70; }
  .rcp { display:flex; flex-direction:column; gap:3px; width:100%; text-align:left; background:transparent; color:var(--txt); border:1.5px dashed rgba(255,216,74,.5); border-radius:6px; padding:12px 14px; margin:0 0 14px; font:500 13px var(--f); cursor:pointer; }
  .rcp b { font-size:16px; font-weight:800; font-stretch:112%; color:var(--acc); } .rcp span { color:var(--mut); } .rcp:hover { border-style:solid; }
</style>
</head>
<body>
<header><button class="sbtn" id="sbtn" aria-label="Szukaj klubu lub zawodnika"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><div class="ttl"><h1 id="cname">Ekstraklasa</h1><p>Jak grają drużyny: styl, mocne i słabe strony</p></div><div class="cs" id="cs"><button data-c="PL1">Ekstraklasa</button><button data-c="CL"><span class="f">Liga Mistrzów</span><span class="s">LM</span></button><button data-c="EL"><span class="f">Liga Europy</span><span class="s">LE</span></button><button data-c="UCOL"><span class="f">Liga Konferencji</span><span class="s">LKE</span></button></div></header>
<nav id="nav">
  <button data-v="live" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/></svg>Na żywo</button>
  <button data-v="round"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Mecze</button>
  <button data-v="table"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Tabela</button>
  <button data-v="teams"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.500-3 7.500-7 9-4-1.500-7-4.500-7-9V6z"/></svg>Drużyny</button>
  <button data-v="cmp"><svg viewBox="0 0 24 24"><path d="M7 4v16M17 4v16M3 8l4-4 4 4M13 16l4 4 4-4"/></svg>Porównaj</button>
</nav>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s), app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtTime = (t) => new Date(t * 1000).toLocaleTimeString("pl-PL", { hour:"2-digit", minute:"2-digit" });
const fmtDay = (t) => new Date(t * 1000).toLocaleDateString("pl-PL", { weekday:"long", day:"numeric", month:"long" });
let view = "live", round = null, maxRound = 34, curRound = null, timer = null, tabMode = "all", cmpA = null, cmpB = null;
const COMPS = { PL1: { name: "Ekstraklasa", gen: "Ekstraklasy", logo: "⚽", rounds: 34 }, CL: { name: "Liga Mistrzów", gen: "Ligi Mistrzów", logo: "⭐", rounds: 8 },
  EL: { name: "Liga Europy", gen: "Ligi Europy", logo: "🏆", rounds: 8 }, UCOL: { name: "Liga Konferencji", gen: "Ligi Konferencji", logo: "🎖️", rounds: 6 } };
let COMP = (() => { const q = new URLSearchParams(location.search).get("c"); let ls = null; try { ls = localStorage.getItem("comp"); } catch {} return COMPS[q] ? q : COMPS[ls] ? ls : "PL1"; })();
function setComp(c, reload = true) {
  COMP = c; try { localStorage.setItem("comp", c); } catch {}
  document.body.dataset.c = c; $("#cname").textContent = COMPS[c].name;
  document.querySelectorAll("#cs button").forEach((b) => b.classList.toggle("on", b.dataset.c === c));
  const u = new URL(location.href); if (c === "PL1") u.searchParams.delete("c"); else u.searchParams.set("c", c); history.replaceState(null, "", u);
  if (reload) { round = null; curRound = null; maxRound = COMPS[c].rounds; cmpA = cmpB = null; dayOff = 0; loading(); crestsFor(c).finally(() => { if (COMP === c) go(view); }); }
}

// strona może działać na GitHub Pages (same pliki), a dane bierze wtedy z serwera na Render
const API_BASE = location.hostname.endsWith("github.io") ? "https://sportapi-app.onrender.com" : "";
async function api(p) {
  const r = await fetch(API_BASE + p + (p.includes("?") ? "&" : "?") + "c=" + COMP); const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || j.message || `Błąd ${r.status}`);
  return j;
}
const note = (d) => (d && d.note ? `<div class="nm">${esc(d.note)}</div>` : "");
const loading = (t = "Ładowanie…") => { app.innerHTML = `<p class="mut">${t}</p>`; };
const fail = (e) => { app.innerHTML = `<p class="err">${esc(e.message)}</p>`; };
const hue = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const initials = (n) => String(n).replace(/[^\p{L} ]/gu, "").split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
const CREST = {};
const crestImg = (c) => `<img src="${esc(c)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.remove('cr');this.remove()">`;
const badge = (n, sz = 28) => { const c = CREST[n];
  return `<span class="bd${c ? " cr" : ""}" data-n="${esc(n)}" style="--h:${hue(n)};width:${sz}px;height:${sz}px;font-size:${Math.round(sz * 0.4)}px">${esc(initials(n))}${c ? crestImg(c) : ""}</span>`; };
const tn = (n, sz = 18) => `<span class="tnm">${badge(n, sz)}${esc(n)}</span>`; // herb + nazwa w tekście
function applyCrests() { document.querySelectorAll(".bd:not(.cr)[data-n]").forEach((el) => { const c = CREST[el.dataset.n]; if (c && !el.querySelector("img")) { el.classList.add("cr"); el.insertAdjacentHTML("beforeend", crestImg(c)); } }); }
const crestJobs = {};
function crestsFor(c) { // herby rozgrywek; po wczytaniu dorysowują się też w już widocznych miejscach
  if (!crestJobs[c]) crestJobs[c] = fetch(`${API_BASE}/api/crests?c=${c}`).then((r) => r.ok ? r.json() : Promise.reject()).then((m) => { Object.assign(CREST, m); applyCrests(); })
    .catch(() => { delete crestJobs[c]; });
  return Promise.race([crestJobs[c], new Promise((r) => setTimeout(r, 4000))]);
}
async function loadCrests() { await crestsFor(COMP); setTimeout(() => Object.keys(COMPS).forEach(crestsFor), 2500); }
const fmtV = (f, x) => x == null ? "–" : f === "pct" ? `${Math.round(x * 10) / 10}%` : f === "n0" ? String(Math.round(x * 10) / 10) : f === "n1" ? (Math.round(x * 10) / 10).toFixed(1) : (Math.round(x * 100) / 100).toFixed(2);
const aiCls = (ai, tm) => !ai || !tm ? "" : ai / tm >= 1.25 ? "up" : ai / tm <= 0.8 ? "dn" : "";
const pctS = (a, b) => (a >= b ? "+" : "") + Math.round((a / b - 1) * 100) + "%";
const mlnE = (v) => v == null ? "–" : v >= 1e6 ? (Math.round(v / 1e5) / 10) + " mln €" : Math.round(v / 1e3) + " tys. €";

function matchRow(e) {
  const st = e.status?.type, live = st === "inprogress", sc = live || st === "finished";
  const d = e.status?.description || "";
  const left = live ? (/^[~\d]|przerwa/.test(d) ? d : "LIVE") : st === "finished" ? "KON." : fmtTime(e.startTimestamp);
  return `<div class="m" data-id="${e.id}"><div class="tm ${live ? "live" : ""}">${left}</div>
    <div><div class="tt">${badge(e.homeTeam?.name, 24)}${esc(e.homeTeam?.name)}</div><div class="tt">${badge(e.awayTeam?.name, 24)}${esc(e.awayTeam?.name)}</div>${tipLine(e)}</div>
    <div class="sc">${sc ? `<div>${e.homeScore?.current ?? "-"}</div><div>${e.awayScore?.current ?? "-"}</div>` : ""}</div></div>`;
}
function bindRows() { document.querySelectorAll(".m[data-id]").forEach((el) => el.onclick = () => openMatch(el.dataset.id)); }
function listByDay(events) {
  let html = "", day = "";
  for (const e of [...events].sort((a, b) => a.startTimestamp - b.startTimestamp)) {
    const d = fmtDay(e.startTimestamp);
    if (d !== day) { day = d; html += `<div class="day">${esc(d)}</div>`; }
    html += matchRow(e);
  }
  return html;
}

async function showLive(silent) {
  if (!silent) loading();
  try {
    const lv = await api("/api/live"), ev = lv.events;
    let html = note(lv);
    if (ev.length) html += `<div class="day">Trwające mecze</div>` + ev.map(matchRow).join("");
    else {
      html += `<button class="rcp" data-recap=""><b>Podsumowanie ostatniej kolejki</b><span>Kto zagrał inaczej niż zwykle, forma, ruchy w tabeli i liczby</span></button><p class="hello">Teraz nie trwa żaden mecz. Najbliższa kolejka:</p>`;
      try {
        const rs = await api("/api/rounds"); curRound = rs.currentRound?.round || 1; maxRound = rs.rounds?.length || 34;
        if (round === null) round = curRound;
        const rd = await api(`/api/round/${curRound}`); html += listByDay(rd.events);
      } catch {}
    }
    app.innerHTML = html + `<p class="mini" style="margin-top:14px">Strona odświeża się sama, gdy trwa mecz. Minuta jest szacowana (~), bo źródło danych jej nie podaje.</p>`;
    bindRows();
    clearInterval(timer);
    if (view === "live") timer = setInterval(() => { if (!document.hidden && view === "live") showLive(true); }, ev.length ? 60000 : 300000);
  } catch (e) { if (!silent) fail(e); }
}

async function showRound() {
  loading();
  try {
    if (round === null) { const r = await api("/api/rounds"); curRound = r.currentRound?.round || 1; maxRound = r.rounds?.length || 34; round = curRound; }
    const rd = await api(`/api/round/${round}`), ev = rd.events || [];
    const ended = ev.length && ev.every((e) => ["finished", "postponed", "canceled"].includes(e.status?.type)) && ev.some((e) => e.status?.type === "finished");
    app.innerHTML = note(rd) + `<div class="bar"><button id="pr" ${round <= 1 ? "disabled" : ""}>‹</button><b>Kolejka ${round}</b><button id="nx" ${round >= maxRound ? "disabled" : ""}>›</button></div>`
      + (ended ? `<button class="rcp" data-recap="${round}"><b>Podsumowanie kolejki</b><span>Kto zagrał inaczej niż zwykle, forma, ruchy w tabeli i liczby kolejki</span></button>` : "")
      + (ev.length ? listByDay(ev) : `<p class="mut">Brak meczów.</p>`);
    $("#pr").onclick = () => { if (round > 1) { round--; showRound(); } };
    $("#nx").onclick = () => { if (round < maxRound) { round++; showRound(); } };
    bindRows();
  } catch (e) { showDay(e.message); }
}
let dayOff = 0;
async function showDay(why) {
  const ds = new Date(Date.now() + dayOff * 86400000).toLocaleDateString("sv-SE");
  loading();
  try {
    const ev = (await api(`/api/day/${ds}`)).events;
    app.innerHTML = `<div class="nm">Tryb zastępczy (API-Football): ${esc(why || "")}<br>Dostępne są tylko mecze z wczoraj, dziś i jutra.</div>
      <div class="bar"><button id="pd" ${dayOff <= -1 ? "disabled" : ""}>‹</button><b>${["Wczoraj", "Dziś", "Jutro"][dayOff + 1]}</b><button id="nd" ${dayOff >= 1 ? "disabled" : ""}>›</button></div>` + (ev.length ? listByDay(ev) : `<p class="mut">Brak meczów ${COMPS[COMP].gen} tego dnia.</p>`);
    $("#pd").onclick = () => { dayOff--; showDay(why); }; $("#nd").onclick = () => { dayOff++; showDay(why); }; bindRows();
  } catch (e2) { app.innerHTML = `<p class="err">${esc(why || e2.message)}</p><p class="mini">Tryb zastępczy też niedostępny: ${esc(e2.message)}</p>`; }
}

const TAB_MODES = [["all", "Ogółem"], ["home", "U siebie"], ["away", "Na wyjeździe"], ["form", "Forma (5)"], ["scorers", "Strzelcy"], ["assists", "Asysty"], ["cards", "Kartki"], ["values", "Wyceny AI"], ["tips", "Typy AI"]];
const pills = () => `<div class="pills">${TAB_MODES.map(([k, t]) => `<button data-m="${k}" class="${k === tabMode ? "on" : ""}">${t}</button>`).join("")}</div>`;
function bindPills() { document.querySelectorAll(".pills button").forEach((b) => b.onclick = () => { tabMode = b.dataset.m; showTable(); }); document.querySelector(".pills button.on")?.scrollIntoView({ inline: "center", block: "nearest" }); }
async function showTable() {
  clearTimeout(timer); clearInterval(timer); timer = null;
  if (["scorers", "assists", "cards"].includes(tabMode)) return showLeaders();
  if (tabMode === "values") return showValues();
  if (tabMode === "tips") return showTips();
  loading();
  try {
    const tb = await api(tabMode === "all" ? "/api/table" : `/api/table/${tabMode}`), rows = tb.standings[0].rows, n = rows.length;
    const zone = (r) => tabMode !== "all" ? "" : COMP !== "PL1" ? (r.position <= 8 ? "z1" : r.position <= 24 ? "z2" : "zr") : r.position === 1 ? "z1" : r.position <= 3 ? "z2" : r.position <= 5 ? "z3" : r.position > n - 3 ? "zr" : "";
    app.innerHTML = pills() + note(tb) + `<div class="card" style="padding:6px 10px"><table>
      <tr><th></th><th class="t">Drużyna</th><th>M</th><th>Z</th><th>R</th><th>P</th><th>Bramki</th><th>Pkt</th></tr>
      ${rows.map((r) => `<tr class="${zone(r)} ${String(r.team.id).startsWith("tm-") ? "click" : ""}" data-tid="${r.team.id}"><td class="pos">${r.position}</td><td class="t"><div class="tn">${badge(r.team.name, 24)}${esc(r.team.name)}</div></td>
        <td>${r.matches}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td><td>${r.scoresFor}:${r.scoresAgainst}</td><td class="pts">${r.points}</td></tr>`).join("")}
    </table></div><p class="mini">${tabMode === "all" ? (COMP !== "PL1" ? "Zielony – 1–8: awans do 1/8 finału · niebieski – 9–24: baraże · czerwony – 25–36: odpadają · " : "Zielony – lider · niebieski – miejsca 2–3 · żółty – 4–5 · czerwony – strefa spadkowa · ") : tabMode === "form" ? "Forma = tylko 5 ostatnich meczów każdej drużyny · " : tabMode === "home" ? "Tylko mecze u siebie · " : "Tylko mecze na wyjeździe · "}kliknij drużynę, by zobaczyć jej profil</p>`;
    bindPills(); document.querySelectorAll("tr.click").forEach((tr) => tr.onclick = () => openTeam(tr.dataset.tid));
  } catch (e) { fail(e); }
}
async function showLeaders() {
  const mode = tabMode;
  try {
    const d = await api("/api/leaders");
    if (mode !== tabMode || view !== "table") return;
    if (!d.ready) {
      app.innerHTML = pills() + `<div class="card"><b>Liczę rankingi z ${d.total} meczów…</b><div class="prog"><i style="width:${Math.round((d.done / (d.total || 1)) * 100)}%"></i></div><p class="mini" style="margin:0">Pierwsze liczenie trwa kilkanaście sekund.</p></div>`;
      bindPills(); timer = setTimeout(showLeaders, 2500); return;
    }
    const val = { scorers: (p) => `<b>${p.g}</b> <span class="mini">${p.pen ? `w tym ${p.pen} z karnych · ` : ""}${p.a} as.</span>`, assists: (p) => `<b>${p.a}</b> <span class="mini">${p.g} goli</span>`, cards: (p) => `<span class="mini">🟨 ${p.y}${p.r ? " · 🟥 " + p.r : ""}</span>` }[mode];
    app.innerHTML = pills() + `<div class="card" style="padding:6px 14px">${d[mode].map((p, i) => `<div class="ld"><span class="r">${i + 1}</span><div style="display:flex;gap:10px;align-items:center">${badge(p.club, 28)}<div>${esc(p.name)}<div class="mini">${esc(p.club)}</div></div></div><div style="text-align:right">${val(p)}</div></div>`).join("") || `<p class="mut">Brak danych.</p>`}</div>
      <p class="mini">Źródło: Transfermarkt, ${d.matches} rozegranych meczów${d.failed ? ` (nie udało się pobrać ${d.failed})` : ""}. Bramki samobójcze nie wliczają się do strzelców.</p>`;
    bindPills();
  } catch (e) { app.innerHTML = pills() + `<p class="err">${esc(e.message)}</p>`; bindPills(); }
}

let valMode = "top";
async function showValues() {
  try {
    app.innerHTML = pills() + `<div class="card"><b>Zbieram kadry wszystkich drużyn…</b><p class="mini" style="margin:4px 0 0">Pierwsze wczytanie trwa kilkanaście sekund.</p></div>`; bindPills();
    const d = await api("/api/values");
    if (tabMode !== "values" || view !== "table") return;
    const sub = [["top", "Najwyżej wyceniani"], ["under", "AI wyżej niż Transfermarkt"], ["over", "AI niżej niż Transfermarkt"]];
    const lr = (p) => Math.log(p.ai / p.tm);
    let list = d.players;
    if (valMode === "top") list = [...list].sort((a, b) => b.ai - a.ai);
    else { list = list.filter((p) => p.tm >= 500000 && (valMode === "under" ? p.ai > p.tm && (p.age ?? 0) < 33 : p.ai < p.tm)); list.sort((a, b) => valMode === "under" ? lr(b) - lr(a) : lr(a) - lr(b)); }
    list = list.slice(0, 50);
    app.innerHTML = pills() + `<div class="pills" style="margin-top:-4px">${sub.map(([k, t]) => `<button data-v2="${k}" class="${k === valMode ? "on" : ""}">${t}</button>`).join("")}</div>
      <div class="card" style="padding:6px 14px">${list.map((p, i) => `<div class="ld" data-pl="${p.id}"><span class="r">${i + 1}</span><div style="display:flex;gap:10px;align-items:center">${badge(p.club, 28)}<div>${esc(p.name)}<div class="mini">${esc(p.club)} · ${esc(p.pos)}${p.age ? " · " + p.age + " l." : ""}</div></div></div><div style="text-align:right"><b style="font-size:19px">${mlnE(p.ai)}</b><div class="aiv ${aiCls(p.ai, p.tm)}">TM ${mlnE(p.tm)}${p.tm ? " · " + pctS(p.ai, p.tm) : ""}</div></div></div>`).join("") || `<p class="mut">Brak zawodników z wyceną AI w tych rozgrywkach.</p>`}</div>
      <p class="mini">Wycena AI dla ${d.players.length} z ${d.squadPlayers} zawodników z kadr ${d.clubs} drużyn. Model wycenia zawodników 8 lig (Anglia, Hiszpania, Niemcy, Włochy, Francja, Portugalia, Holandia, Polska), dane do ${fmtDate(d.asOf)}. To eksperyment: mediana błędu na ${d.model.n_test} transferach testowych wynosi ${Math.round(d.model.mv_median_ape * 100)}%, więc wyceny Transfermarkt są zwykle trafniejsze.${valMode === "under" ? " Pomijamy zawodników od 33 lat, bo model wyraźnie ich przeszacowuje." : ""}</p>`;
    bindPills(); document.querySelectorAll("[data-v2]").forEach((b) => b.onclick = () => { valMode = b.dataset.v2; showValues(); });
  } catch (e) { app.innerHTML = pills() + `<p class="err">${esc(e.message)}</p>`; bindPills(); }
}
const POS_N = { Goalkeeper: "bramkarz", "Centre-Back": "środkowy obrońca", "Left-Back": "lewy obrońca", "Right-Back": "prawy obrońca", "Defensive Midfield": "defensywny pomocnik",
  "Central Midfield": "środkowy pomocnik", "Attacking Midfield": "ofensywny pomocnik", "Left Midfield": "lewy pomocnik", "Right Midfield": "prawy pomocnik", "Left Winger": "lewy skrzydłowy",
  "Right Winger": "prawy skrzydłowy", "Centre-Forward": "środkowy napastnik", "Second Striker": "cofnięty napastnik" };
const fmtDate = (iso) => iso ? new Date(String(iso).slice(0, 10) + "T12:00:00").toLocaleDateString("pl-PL", { day: "numeric", month: "long", year: "numeric" }) : "–";

async function openPlayerAi(id) {
  const sh = document.createElement("div"); sh.className = "sheet";
  sh.innerHTML = `<div class="sb2"><button class="x" aria-label="Zamknij">✕</button><p class="mut">Wczytuję wycenę…</p></div>`;
  const close = () => { sh.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", esc_); };
  const esc_ = (e) => { if (e.key === "Escape") close(); };
  sh.onclick = (e) => { const g = e.target.closest("[data-goteam]"); if (g) return goTeam(g.dataset.goteam, g.dataset.comps.split(",")); if (e.target === sh || e.target.closest(".x")) close(); };
  document.addEventListener("keydown", esc_); document.body.style.overflow = "hidden"; document.body.appendChild(sh);
  try {
    const d = await api(`/api/player-ai/${id}`);
    const teamBtn = d.club ? `<button class="btn" style="margin-top:16px" data-goteam="${d.club.id}" data-comps="${d.club.comps.join(",")}">Strona drużyny: ${tn(d.club.name, 18)}</button>` : "";

      if (p.radar) h += `<div class="card"><h3 style="margin-top:0">Charakter drużyny na tle ligi</h3>${radarSvg([{ label: d.team.name, color: "#ffd84a", vals: p.radar }])}<p class="mini" style="text-align:center;margin:6px 0 0">Im dalej od środka, tym lepiej na tle ligi (100 = najlepsza w lidze). Atak: bramki, strzały, skuteczność · Obrona: stracone bramki i strzały rywali · Kontrola: posiadanie i podania · Dyscyplina: mało fauli i kartek · Końcówki: bramki po 75. min · Charakter: punkty po straconym/zdobytym pierwszym golu, dom i wyjazd.</p></div>`;
      h += `<div class="grid2 stack"><div class="card"><h3 style="margin-top:0;color:var(--acc)">Mocne strony</h3>${p.strengths.length ? `<ul class="sw g">${p.strengths.map((s) => { const [a, b] = s.split(" — "); return `<li>${esc(a)}<small>${esc(b)}</small></li>`; }).join("")}</ul>` : `<p class="mini">Brak wyraźnych przewag nad resztą ligi.</p>`}</div>
        <div class="card"><h3 style="margin-top:0;color:var(--red)">Słabe strony</h3>${p.weaknesses.length ? `<ul class="sw w">${p.weaknesses.map((s) => { const [a, b] = s.split(" — "); return `<li>${esc(a)}<small>${esc(b)}</small></li>`; }).join("")}</ul>` : `<p class="mini">Brak wyraźnych słabości na tle ligi.</p>`}</div></div>`;
      h += `<div class="card ai" id="aibox"><h3 style="margin-top:0">Opis stylu gry</h3><button class="btn pri" id="aigo">Wygeneruj opis (AI)</button> <span class="mini">na podstawie statystyk drużyny · ok. 30 s</span></div>`;
      if (p.series?.length > 1) { const tdef = (k) => defs.find((x) => x.key === k);
        h += `<div class="card"><h3 style="margin-top:0">Trend w sezonie</h3><div class="tabs2" id="trtabs">${TREND.map(([k, l], i) => `<button data-k="${k}" class="${i === 0 ? "on" : ""}">${l}</button>`).join("")}</div><div id="trchart"></div></div>`; }
      if (p.similar?.length) h += `<div class="card"><h3 style="margin-top:0">Gra podobnie do…</h3>${p.similar.map((x) => `<div class="sim" data-open="${x.id}">${badge(x.name, 30)}<span class="sn">${esc(x.name)}</span><div class="sb"><i style="width:${x.sim}%"></i></div><b>${x.sim}%</b></div>`).join("")}
        <h3>Najmniej podobna do</h3>${(p.different || []).map((x) => `<div class="sim" data-open="${x.id}">${badge(x.name, 30)}<span class="sn">${esc(x.name)}</span><div class="sb"><i style="width:${x.sim}%;background:var(--red)"></i></div><b>${x.sim}%</b></div>`).join("")}
        <p class="mini" style="margin:8px 0 0">Podobieństwo stylu liczone z 14 statystyk (m.in. strzały, posiadanie, podania, odbiory, faule, bramki po 75. min). 100% = identyczny profil.</p></div>`;
      h += `<div class="card"><h3 style="margin-top:0">Kiedy pada bramka (zdobyte / stracone)</h3>${timingSvg(p.timing, ["1–15", "16–30", "31–45", "46–60", "61–75", "76–90"])}<div class="legend"><span><i style="background:#ffd84a"></i>zdobyte</span><span><i style="background:#ff7b6b"></i>stracone</span></div></div>`;
      const tt = p.types, tot = Math.max(1, tt.total);
      if (tt.total) { const segs = TYPE_DEF.map(([k, l, c]) => [k, l, c, tt[k] || 0]).filter((x) => x[3]);
        h += `<div class="card"><h3 style="margin-top:0">Jak strzela bramki</h3><div class="stack1">${segs.map(([, , c, n]) => `<i style="width:${(n / tot) * 100}%;background:${c}"></i>`).join("")}</div><div class="legend">${segs.map(([, l, c, n]) => `<span><i style="background:${c}"></i>${l}: ${n}</span>`).join("")}</div></div>`; }
      if (p.formations.length) h += `<div class="card"><h3 style="margin-top:0">Ustawienia taktyczne</h3>${p.formations.map((f) => `<span class="tag">${esc(f.name)} · ${f.count}×</span>`).join("")}</div>`;
      const gr = {}; for (const df of defs) (gr[df.group] ||= []).push(df);
      for (const [grp, ds] of Object.entries(gr)) h += `<div class="card"><h3 style="margin-top:0">${esc(grp)}</h3>` + ds.map((df) => { const v = p.metrics[df.key], rk = p.ranks[df.key], pc = p.pct[df.key]; if (v == null) return "";
        const cls = df.better === null ? "" : pc >= 66 ? "g" : pc <= 33 ? "b" : "m";
        return `<div class="mr"><div class="mt"><span>${esc(df.label)}</span><b>${fmtV(df.fmt, v)}</b></div><div class="mbar ${cls}"><i style="width:${Math.max(4, pc ?? 0)}%"></i></div><div class="ml"><span>${rk}. w lidze</span><span>średnia ligi ${fmtV(df.fmt, df.avg)}</span></div></div>`; }).join("") + `</div>`;
      h += `<p class="mini">Wszystkie wartości to średnie z rozegranych meczów sezonu (${p.withData} z ${p.matches} meczów ze szczegółowymi danymi). Pasek pokazuje pozycję na tle ligi.</p>`;
    }
    if (d.unavailable.length) h += `<div class="card"><h3 style="margin-top:0">Niedostępni</h3>` + d.unavailable.map((u) => `<div style="padding:3px 0"><span class="tag ${u.type === "zawieszenie" ? "sus" : "inj"}">${u.type}</span>${esc(u.name)} <span class="mini">– ${esc(u.reason)}${u.until ? ", do " + esc(u.until) : ", brak daty powrotu"}</span></div>`).join("") + `</div>`;
    if (d.scorers.length) h += `<div class="card"><h3 style="margin-top:0">Najlepsi strzelcy w lidze</h3>` + d.scorers.map((s) => `<div class="pl" style="grid-template-columns:1fr auto"><div>${esc(s.name)}</div><div class="v">${s.goals} goli · ${s.assists} asyst</div></div>`).join("") + `</div>`;
    const nAi = d.squad.filter((x) => x.ai).length;
    h += `<div class="card"><h3 style="margin-top:0">Kadra · wartość ${mlnE(d.squadValue)}</h3>${nAi ? `<p class="mini" style="margin:-4px 0 4px">Pod kwotą Transfermarkt: wycena modelu AI (${nAi} z ${d.squad.length} zawodników). Zielona – AI wycenia wyraźnie wyżej, czerwona – niżej. Kliknij zawodnika, by zobaczyć szczegóły.</p>` : ""}` + order.filter((g) => groups[g]).map((g) => `<div class="grp">${g}</div>` + groups[g].map((x) => `<div class="pl"${x.ai ? ` data-pl="${x.id}"` : ""}><div class="mut">${x.shirt ?? ""}</div><div>${esc(x.name)}${x.captain ? " ©" : ""} <span class="mini">${esc(x.age ? x.age + " l." : "")}</span></div><div class="v" style="text-align:right">${mlnE(x.value)}${x.ai ? `<div class="aiv ${aiCls(x.ai.mv, x.value)}">AI ${mlnE(x.ai.mv)}</div>` : ""}</div></div>`).join("")).join("") + `</div>`;
    app.innerHTML = h + `<p class="mini">Źródło: Transfermarkt (wartości rynkowe, kontuzje, statystyki meczów). Kontuzje i zawieszenia sprawdzane dla 22 najcenniejszych zawodników.</p>`;
    $("#bk").onclick = () => go("teams");
    if ($("#aigo")) $("#aigo").onclick = () => runAi(id);
    document.querySelectorAll(".sim[data-open]").forEach((el) => el.onclick = () => openTeam(el.dataset.open));
    if (p && $("#trtabs")) { const drawTr = (k) => { const [, , c] = TREND.find((x) => x[0] === k); $("#trchart").innerHTML = trendSvg(p.series, k, c, (P?.defs || []).find((x) => x.key === k)?.avg ?? null);
        document.querySelectorAll("#trtabs button").forEach((b) => b.classList.toggle("on", b.dataset.k === k)); };
      document.querySelectorAll("#trtabs button").forEach((b) => b.onclick = () => drawTr(b.dataset.k)); drawTr("poss"); }
    if (!p) timer = setTimeout(() => { if (view === "teams" && $("#bk")) openTeam(id); }, 3000);
  } catch (e) { fail(e); }
}
const ul = (a) => `<ul>${(a || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
async function runAi(id) {
  const box = $("#aibox"); box.innerHTML = `<h3 style="margin-top:0">Opis stylu gry</h3><p class="mut">Model analizuje statystyki drużyny… (do ok. 45 s)</p>`;
  try {
    const d = await api(`/api/profile-ai/${id}`), a = d.ai;
    if (!a) { box.innerHTML = `<h3 style="margin-top:0">Opis stylu gry</h3><p style="white-space:pre-wrap;font-size:14px">${esc(d.raw || "Brak odpowiedzi")}</p>`; return; }
    box.innerHTML = `<h3 style="margin-top:0">Opis stylu gry</h3><p><b>${esc(a.w_skrocie)}</b></p><h4>Styl</h4><p>${esc(a.styl_gry)}</p><h4>Atak</h4><p>${esc(a.jak_atakuje)}</p><h4>Obrona</h4><p>${esc(a.jak_sie_broni)}</p>
      <h4>Mocne strony</h4>${ul(a.mocne_strony)}<h4>Słabe strony</h4>${ul(a.slabe_strony)}${a.kluczowi_zawodnicy?.length ? `<h4>Kluczowi zawodnicy</h4>${ul(a.kluczowi_zawodnicy)}` : ""}${a.na_co_zwrocic_uwage?.length ? `<h4>Na co zwrócić uwagę</h4>${ul(a.na_co_zwrocic_uwage)}` : ""}
      <p class="mini" style="margin-top:12px">Opis wygenerował model AI (${esc(String(d.model).split("/")[1])}) wyłącznie na podstawie statystyk z sezonu. To interpretacja danych, nie ocena ostateczna.</p>`;
  } catch (e) { box.innerHTML = `<h3 style="margin-top:0">Opis stylu gry</h3><p class="err">${esc(e.message)}</p><button class="btn" id="aigo">Spróbuj ponownie</button>`; $("#aigo").onclick = () => runAi(id); }
}

async function showCompare() {
  loading();
  try {
    const P = await api("/api/profiles");
    if (!P.ready) { app.innerHTML = `<div class="card"><b>Liczę profile drużyn z ${P.progress.total} meczów…</b><div class="prog"><i style="width:${Math.round((P.progress.done / (P.progress.total || 1)) * 100)}%"></i></div></div>`; timer = setTimeout(() => { if (view === "cmp") showCompare(); }, 2500); return; }
    const teams = [...P.teams].sort((a, b) => a.name.localeCompare(b.name, "pl"));
    cmpA = cmpA && teams.some((t) => t.id === cmpA) ? cmpA : teams[0].id; cmpB = cmpB && teams.some((t) => t.id === cmpB) ? cmpB : teams[1].id;
    const opt = (sel) => teams.map((t) => `<option value="${t.id}" ${t.id === sel ? "selected" : ""}>${esc(t.name)}</option>`).join("");
    app.innerHTML = `<p class="hello">Zestaw dwie drużyny i zobacz, czym się różnią w grze.</p><div class="card"><div class="row2"><span id="ba"></span><select id="ca">${opt(cmpA)}</select><span class="mut">vs</span><select id="cb">${opt(cmpB)}</select><span id="bb"></span></div></div><div id="cres"></div>`;
    const sw = (T) => `<h3 style="margin-top:0;color:var(--acc)">${tn(T.name, 20)} – mocne</h3><ul class="sw g">${T.strengths.slice(0, 3).map((s) => `<li>${esc(s.split(" — ")[0])}</li>`).join("") || "<li>–</li>"}</ul><h3 style="color:var(--red)">Słabe</h3><ul class="sw w">${T.weaknesses.slice(0, 3).map((s) => `<li>${esc(s.split(" — ")[0])}</li>`).join("") || "<li>–</li>"}</ul>`;
    const draw = () => { cmpA = $("#ca").value; cmpB = $("#cb").value; const A = teams.find((t) => t.id === cmpA), B = teams.find((t) => t.id === cmpB);
      $("#ba").innerHTML = badge(A.name, 30); $("#bb").innerHTML = badge(B.name, 30);
      const gr = {}; for (const df of P.defs) (gr[df.group] ||= []).push(df);
      $("#cres").innerHTML = `<div class="card"><div class="big"><div class="t">${badge(A.name, 48)}<div class="n">${esc(A.name)}</div></div><div class="s" style="font-size:22px;color:var(--mut)">vs</div><div class="t">${badge(B.name, 48)}<div class="n">${esc(B.name)}</div></div></div>
        <div class="grid2" style="margin-top:10px"><div>${A.tags.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</div><div style="text-align:right">${B.tags.map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</div></div>
        ${A.radar && B.radar ? `<div style="margin-top:8px">${radarSvg([{ label: A.name, color: "#ffd84a", vals: A.radar }, { label: B.name, color: "#8cb8ff", vals: B.radar }])}<div class="legend" style="justify-content:center"><span><i style="background:#ffd84a"></i>${tn(A.name, 16)}</span><span><i style="background:#8cb8ff"></i>${tn(B.name, 16)}</span></div></div>` : ""}</div>`
        + Object.entries(gr).map(([g, ds]) => `<div class="card"><h3 style="margin-top:0">${esc(g)}</h3>${cmpRows(ds, A, B)}</div>`).join("")
        + `<div class="grid2 stack"><div class="card">${sw(A)}</div><div class="card">${sw(B)}</div></div><p class="mini">Zielona wartość = lepszy wynik w kategorii (cechy stylu, np. posiadanie, bez oceny). Średnie z meczów sezonu.</p>`; };
    $("#ca").onchange = draw; $("#cb").onchange = draw; draw();
  } catch (e) { fail(e); }
}

function go(v) {
  view = v; clearInterval(timer); clearTimeout(timer); timer = null;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  window.scrollTo({ top: 0 });
  ({ live: showLive, round: showRound, table: showTable, teams: showTeams, cmp: showCompare }[v] || showTable)();
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => go(b.dataset.v));
document.querySelectorAll("#cs button").forEach((b) => b.onclick = () => { if (b.dataset.c !== COMP) setComp(b.dataset.c); });
setComp(COMP, false);
$("#sbtn").onclick = openSearch;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
loadCrests().finally(() => go("live"));
</script>
</body>
</html>
