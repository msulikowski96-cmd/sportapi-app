<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekstraklasa</title>
<style>
  :root { --bg:#0e1118; --card:#171c28; --line:#262e42; --txt:#e9edf6; --mut:#8a96b2; --acc:#e11d48; --live:#ef4444; --ok:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:14px 16px 0; background:var(--bg); position:sticky; top:0; z-index:5; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 10px; font-size:19px; } h1 span { color:var(--acc); }
  nav { display:flex; gap:4px; overflow-x:auto; }
  nav button { background:none; border:0; color:var(--mut); font-size:14px; padding:10px 12px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
  nav button.on { color:var(--txt); border-color:var(--acc); font-weight:600; }
  main { max-width:760px; margin:0 auto; padding:14px; }
  .mut { color:var(--mut); } .err { color:#fca5a5; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { color:var(--mut); font-weight:500; font-size:12px; text-align:center; padding:6px 4px; }
  td { padding:9px 4px; text-align:center; border-top:1px solid var(--line); }
  td.t { text-align:left; font-weight:500; } th.t { text-align:left; }
  td.pos { color:var(--mut); width:26px; } td.pts { font-weight:700; }
  tr.z1 td.pos { box-shadow:inset 3px 0 var(--ok); } tr.z2 td.pos { box-shadow:inset 3px 0 #3b82f6; } tr.z3 td.pos { box-shadow:inset 3px 0 #f59e0b; } tr.zr td.pos { box-shadow:inset 3px 0 var(--live); }
  .bar { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; }
  .bar button, .btn { background:var(--card); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:15px; cursor:pointer; }
  .bar b { min-width:110px; text-align:center; }
  .day { color:var(--mut); font-size:12px; margin:14px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  .m { display:grid; grid-template-columns:50px 1fr auto; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:6px; cursor:pointer; }
  .m:hover { border-color:var(--acc); }
  .tm { color:var(--mut); font-size:13px; } .tm.live { color:var(--live); font-weight:700; }
  .sc { text-align:right; font-weight:700; min-width:22px; } .m div div, .sc div { padding:1px 0; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .big { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; text-align:center; }
  .big .n { font-size:17px; font-weight:600; } .big .s { font-size:34px; font-weight:800; }
  .sub { text-align:center; color:var(--mut); font-size:13px; margin:6px 0 12px; }
  h3 { margin:18px 0 8px; font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
  .inc { display:grid; grid-template-columns:1fr 44px 1fr; gap:6px; font-size:14px; padding:4px 0; }
  .inc .h { text-align:right; } .inc .mn { text-align:center; color:var(--mut); }
  .st { margin:9px 0; font-size:13px; } .st .l { display:flex; justify-content:space-between; margin-bottom:3px; }
  .st .b { display:flex; height:6px; background:var(--line); border-radius:3px; overflow:hidden; } .st .b i { background:var(--acc); display:block; }
  .lu { display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:13px; } .lu div div { padding:2px 0; }
  .lu .no { color:var(--mut); display:inline-block; width:24px; }
  .back { margin-bottom:12px; }
  .row2 { display:flex; gap:8px; } .row2 select { flex:1; min-width:0; background:var(--bg); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px; font-size:15px; }
  .btn:disabled, .bar button:disabled { opacity:.4; }
  .chips { display:flex; gap:6px; margin:8px 0; } .chip { width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-weight:700; font-size:13px; color:#fff; }
  .chip.Z { background:#16a34a; } .chip.R { background:#6b7280; } .chip.P { background:#dc2626; }
  .nm { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin:10px 0; font-size:14px; }
  ul.ai { margin:4px 0 0; padding-left:18px; font-size:14px; line-height:1.45; } ul.ai li { margin:3px 0; }
  .prob { display:flex; height:26px; border-radius:7px; overflow:hidden; margin:8px 0 4px; font-size:12px; font-weight:700; }
  .prob div { display:grid; place-items:center; color:#fff; min-width:0; } .prob .h { background:#2563eb; } .prob .d { background:#6b7280; } .prob .a { background:#e11d48; }
  .probl { display:flex; justify-content:space-between; font-size:12px; color:var(--mut); }
  .disc { color:var(--mut); font-size:12px; margin-top:14px; }
  tr.click { cursor:pointer; } tr.click:hover td.t { color:var(--acc); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } @media (max-width:560px){ .grid2 { grid-template-columns:1fr; } }
  .kpi { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; } .kpi b { display:block; font-size:22px; }
  .pl { display:grid; grid-template-columns:28px 1fr auto; gap:6px; font-size:13px; padding:3px 0; border-top:1px solid var(--line); } .pl .v { color:var(--mut); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:6px; background:#7f1d1d; color:#fecaca; margin-right:6px; } .tag.s { background:#78350f; color:#fde68a; }
  .ok { color:var(--ok); } .bad { color:var(--live); }
  canvas.pitch { width:100%; height:auto; border-radius:8px; margin-top:10px; display:block; }
</style>
</head>
<body>
<header>
  <h1>⚽ <span>Ekstraklasa</span></h1>
  <nav id="nav">
    <button data-v="live" class="on">🔴 Na żywo</button>
    <button data-v="round">Kolejki</button>
    <button data-v="table">Tabela</button>
    <button data-v="teams">🏟 Drużyny</button>
    <button data-v="ai">🤖 Analiza AI</button>
    <button data-v="pred">📈 Trafność</button>
  </nav>
</header>
<main id="app"></main>
<script>
const $ = (s) => document.querySelector(s), app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const fmtTime = (t) => new Date(t * 1000).toLocaleTimeString("pl-PL", { hour:"2-digit", minute:"2-digit" });
const fmtDay = (t) => new Date(t * 1000).toLocaleDateString("pl-PL", { weekday:"long", day:"numeric", month:"long" });
let view = "live", round = null, maxRound = 34, curRound = null, timer = null, last = null;

async function api(p) {
  const r = await fetch(p); const j = await r.json();
  if (!r.ok) throw new Error(j.error || j.message || `Błąd ${r.status}`);
  return j;
}
const note = (d) => (d && d.note ? `<div class="nm">${esc(d.note)}</div>` : "");
const loading = (t = "Ładowanie…") => { app.innerHTML = `<p class="mut">${t}</p>`; };
const fail = (e) => { app.innerHTML = `<p class="err">${esc(e.message)}</p>`; };

function matchRow(e) {
  const st = e.status?.type, live = st === "inprogress", sc = live || st === "finished";
  const left = live ? "LIVE" : st === "finished" ? "KON." : fmtTime(e.startTimestamp);
  return `<div class="m" data-id="${e.id}"><div class="tm ${live ? "live" : ""}">${left}</div>
    <div><div>${esc(e.homeTeam?.name)}</div><div>${esc(e.awayTeam?.name)}</div></div>
    <div class="sc">${sc ? `<div>${e.homeScore?.current ?? "-"}</div><div>${e.awayScore?.current ?? "-"}</div>` : ""}</div></div>`;
}
function bindRows() { document.querySelectorAll(".m").forEach((el) => el.onclick = () => openMatch(el.dataset.id)); }
function listByDay(events) {
  let html = "", day = "";
  for (const e of [...events].sort((a, b) => a.startTimestamp - b.startTimestamp)) {
    const d = fmtDay(e.startTimestamp);
    if (d !== day) { day = d; html += `<div class="day">${esc(d)}</div>`; }
    html += matchRow(e);
  }
  return html;
}

async function showLive(silent) {
  if (!silent) loading();
  try {
    const lv = await api("/api/live"), ev = lv.events;
    const fb = lv.source === "api-football" ? `<div class="nm">Tryb zastępczy: dane z API-Football (SportAPI7 niedostępne).</div>` : "";
    app.innerHTML = note(lv) + (ev.length
      ? fb + `<div class="day">Trwające mecze</div>` + ev.map(matchRow).join("")
      : `<p class="mut">Teraz nie trwa żaden mecz Ekstraklasy. Zobacz zakładkę „Kolejki”.</p>`);
    app.insertAdjacentHTML("beforeend", `<p><button class="btn" id="rf">↻ Odśwież</button> <span class="mut" style="font-size:12px">dane z pamięci podręcznej (oszczędzanie dziennego limitu API)</span></p>`);
    $("#rf").onclick = () => showLive();
    bindRows();
  } catch (e) { if (!silent) fail(e); }
}

async function showRound() {
  loading();
  try {
    if (round === null) {
      const r = await api("/api/rounds");
      curRound = r.currentRound?.round || 1; maxRound = r.rounds?.length || 34; round = curRound;
    }
    const rd = await api(`/api/round/${round}`), ev = rd.events || [];
    app.innerHTML = note(rd) + `<div class="bar"><button id="pr">‹</button><b>Kolejka ${round}</b><button id="nx">›</button></div>`
      + (ev.length ? listByDay(ev) : `<p class="mut">Brak meczów.</p>`);
    $("#pr").onclick = () => { if (round > 1) { round--; showRound(); } };
    $("#nx").onclick = () => { if (round < maxRound) { round++; showRound(); } };
    bindRows();
  } catch (e) { showDay(e.message); }
}

// Tryb zastępczy: mecze z wczoraj/dziś/jutro z API-Football
let dayOff = 0;
async function showDay(why) {
  const ds = new Date(Date.now() + dayOff * 86400000).toLocaleDateString("sv-SE");
  loading();
  try {
    const ev = (await api(`/api/day/${ds}`)).events;
    app.innerHTML = `<div class="nm">Tryb zastępczy (API-Football): ${esc(why || "")}<br><span class="mut">Dostępne są tylko mecze z wczoraj, dziś i jutra.</span></div>
      <div class="bar"><button id="pd" ${dayOff <= -1 ? "disabled" : ""}>‹</button><b>${["Wczoraj", "Dziś", "Jutro"][dayOff + 1]}</b><button id="nd" ${dayOff >= 1 ? "disabled" : ""}>›</button></div>`
      + (ev.length ? listByDay(ev) : `<p class="mut">Brak meczów Ekstraklasy tego dnia.</p>`);
    $("#pd").onclick = () => { dayOff--; showDay(why); };
    $("#nd").onclick = () => { dayOff++; showDay(why); };
    bindRows();
  } catch (e2) {
    app.innerHTML = `<p class="err">${esc(why || e2.message)}</p><p class="mut" style="font-size:12px">Tryb zastępczy też niedostępny: ${esc(e2.message)}</p>`;
  }
}

async function showTable() {
  loading();
  try {
    const tb = await api("/api/table"), rows = tb.standings[0].rows, n = rows.length;
    const zone = (r) => r.position === 1 ? "z1" : r.position <= 3 ? "z2" : r.position <= 5 ? "z3" : r.position > n - 3 ? "zr" : "";
    app.innerHTML = note(tb) + `<div class="panel" style="padding:8px 10px"><table>
      <tr><th></th><th class="t">Drużyna</th><th>M</th><th>Z</th><th>R</th><th>P</th><th>Bramki</th><th>Pkt</th></tr>
      ${rows.map((r) => `<tr class="${zone(r)} ${String(r.team.id).startsWith("tm-") ? "click" : ""}" data-tid="${r.team.id}"><td class="pos">${r.position}</td><td class="t">${esc(r.team.name)}</td>
        <td>${r.matches}</td><td>${r.wins}</td><td>${r.draws}</td><td>${r.losses}</td>
        <td>${r.scoresFor}:${r.scoresAgainst}</td><td class="pts">${r.points}</td></tr>`).join("")}
    </table></div>
    <p class="mut" style="font-size:12px">Zielony – lider · niebieski – miejsca 2–3 · żółty – 4–5 · czerwony – strefa spadkowa · kliknij drużynę, by zobaczyć jej stronę</p>`;
    document.querySelectorAll("tr.click").forEach((tr) => tr.onclick = () => openTeam(tr.dataset.tid));
  } catch (e) { fail(e); }
}

function incLine(i) {
  const home = i.isHome === true;
  const side = (txt) => home ? [txt, ""] : ["", txt];
  let txt = null;
  if (i.incidentType === "goal") txt = `⚽ ${esc(i.player?.name || "Gol")}${i.incidentClass === "ownGoal" ? " (sam.)" : i.incidentClass === "penalty" ? " (k.)" : ""}`;
  else if (i.incidentType === "card") txt = `${i.incidentClass === "yellow" ? "🟨" : "🟥"} ${esc(i.player?.name || "")}`;
  else return "";
  const [h, a] = side(txt);
  return `<div class="inc"><div class="h">${h}</div><div class="mn">${i.time}'</div><div>${a}</div></div>`;
}

async function openMatch(id) {
  clearInterval(timer); timer = null;
  loading("Ładowanie meczu…");
  window.scrollTo({ top: 0 });
  try {
    const [ev, inc, stats, lu] = await Promise.all([
      api(`/api/event/${id}`),
      api(`/api/event/${id}/incidents`).catch(() => ({})),
      api(`/api/event/${id}/stats`).catch(() => ({})),
      api(`/api/event/${id}/lineups`).catch(() => ({})),
    ]);
    const e = ev.event, played = ["inprogress", "finished"].includes(e.status?.type);
    let html = `<button class="btn back" id="bk">‹ Wróć</button><div class="panel">
      <div class="big"><div class="n">${esc(e.homeTeam?.name)}</div>
      <div class="s">${played ? `${e.homeScore?.current ?? 0} : ${e.awayScore?.current ?? 0}` : fmtTime(e.startTimestamp)}</div>
      <div class="n">${esc(e.awayTeam?.name)}</div></div>
      <div class="sub">${esc(e.status?.description || "")} · ${esc(fmtDay(e.startTimestamp))} ${fmtTime(e.startTimestamp)}<br>
      ${esc([e.venue?.stadium?.name, e.venue?.city?.name].filter(Boolean).join(", "))}${e.referee?.name ? " · sędzia: " + esc(e.referee.name) : ""}</div>`;
    const lines = (inc.incidents || []).filter((i) => ["goal", "card"].includes(i.incidentType)).sort((a, b) => a.time - b.time).map(incLine).join("");
    if (lines) html += `<h3>Przebieg</h3>${lines}`;
    const grp = (stats.statistics || []).find((s) => s.period === "ALL")?.groups?.[0]?.statisticsItems || [];
    if (grp.length) html += `<h3>Statystyki</h3>` + grp.slice(0, 10).map((s) => {
      const h = parseFloat(s.homeValue ?? s.home) || 0, a = parseFloat(s.awayValue ?? s.away) || 0, t = h + a || 1;
      return `<div class="st"><div class="l"><span>${esc(s.home)}</span><span class="mut">${esc(s.name)}</span><span>${esc(s.away)}</span></div>
        <div class="b"><i style="width:${(h / t) * 100}%"></i></div></div>`;
    }).join("");
    if (lu.home?.players?.length) {
      const col = (t) => `<div><b>${esc(t.formation || "")}</b>` + t.players.filter((p) => !p.substitute)
        .map((p) => `<div><span class="no">${p.shirtNumber ?? ""}</span>${esc(p.player.name)}</div>`).join("") + `</div>`;
      html += `<h3>Składy</h3><div class="lu">${col(lu.home)}${col(lu.away)}</div>`;
    }
    app.innerHTML = html + `</div>`;
    $("#bk").onclick = () => go(view);
  } catch (err) { fail(err); }
}

// ---------- Analiza AI (NVIDIA Nemotron) ----------
let anTeam = null;
async function showAnalysis() {
  loading();
  try {
    const rows = (await api("/api/table")).standings[0].rows;
    app.innerHTML = `<div class="panel"><div class="row2"><select id="tm">${rows.map((r) =>
      `<option value="${r.team.id}" ${String(r.team.id) === String(anTeam) ? "selected" : ""}>${r.position}. ${esc(r.team.name)}</option>`).join("")}</select>
      <button class="btn" id="an">Analizuj</button></div>
      <p class="mut" style="font-size:12px;margin:8px 0 0">Forma, mocne i słabe strony oraz typ następnego meczu – model NVIDIA Nemotron 3 Ultra na podstawie danych z API.</p></div><div id="res"></div>`;
    $("#an").onclick = () => runAnalysis($("#tm").value);
  } catch (e) { fail(e); }
}
async function runAnalysis(id) {
  anTeam = id; const box = $("#res"), b = $("#an");
  box.innerHTML = `<p class="mut">Nemotron analizuje dane… (może potrwać do ok. 30 s)</p>`; b.disabled = true;
  try { const d = await api(`/api/analysis/${id}`); box.innerHTML = renderAnalysis(d); wireHeat(d); }
  catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
  finally { if ($("#an")) $("#an").disabled = false; }
}
const li = (a) => `<ul class="ai">${(a || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
function renderAnalysis(d) {
  const t = d.table, a = d.ai, n = d.next;
  let h = `<div class="panel"><div style="font-size:18px;font-weight:700">${esc(d.team.name)}</div>
    <div class="mut" style="font-size:13px">${t.miejsce}. miejsce · ${t.punkty} pkt · ${t.mecze} mecze · bilans ${t.zwyciestwa}-${t.remisy}-${t.porazki} · bramki ${esc(t.bramki)}</div>
    <h3>Forma (od najstarszego)</h3><div class="chips">${[...d.form].reverse().map((m) =>
      `<div class="chip ${m.res}" title="${esc(m.opponent)} ${m.gf}:${m.ga}">${m.res}</div>`).join("")}</div>
    <div class="mut" style="font-size:12px">${[...d.form].reverse().map((m) => `${m.home ? "d" : "w"} ${esc(m.opponent)} ${m.gf}:${m.ga}`).join(" · ")}</div>`;
  if (n) h += `<div class="nm">Następny mecz: <b>${n.home ? esc(d.team.name) : esc(n.opponent)} – ${n.home ? esc(n.opponent) : esc(d.team.name)}</b><br>
    <span class="mut">kolejka ${n.round ?? "?"} · ${esc(fmtDay(n.date))} ${fmtTime(n.date)}</span></div>`;
  if (!a) return h + `<h3>Odpowiedź modelu</h3><p style="white-space:pre-wrap;font-size:14px">${esc(d.raw || "Brak odpowiedzi")}</p></div>`;
  h += `<h3>Forma</h3><p style="font-size:14px;line-height:1.45;margin:4px 0">${esc(a.podsumowanie_formy)}</p>
    <h3>Mocne strony</h3>${li(a.mocne_strony)}<h3>Słabe strony</h3>${li(a.slabe_strony)}<h3>Kluczowe czynniki</h3>${li(a.kluczowe_czynniki)}`;
  const p = a.prognoza;
  if (p && n) {
    const hn = n.home ? d.team.name : n.opponent, an = n.home ? n.opponent : d.team.name;
    const w = [p.wygrana_gospodarzy, p.remis, p.wygrana_gosci].map((x) => Math.max(0, Number(x) || 0));
    h += `<h3>Prognoza</h3><div style="font-size:14px">Typowany wynik: <b>${esc(p.typowany_wynik)}</b> · pewność: ${esc(p.pewnosc)}</div>
      <div class="prob"><div class="h" style="width:${w[0]}%">${w[0]}%</div><div class="d" style="width:${w[1]}%">${w[1]}%</div><div class="a" style="width:${w[2]}%">${w[2]}%</div></div>
      <div class="probl"><span>${esc(hn)}</span><span>remis</span><span>${esc(an)}</span></div>
      <p style="font-size:14px;line-height:1.45">${esc(p.uzasadnienie)}</p>`;
  }
  h += `<div id="hm"></div><div class="disc">Analiza wygenerowana przez model AI (${esc(d.model.split("/")[1])}) wyłącznie na podstawie wyników i statystyk z API. To opinia, nie gwarancja wyniku.</div></div>`;
  return h;
}

// ---------- Heatmapa zawodnika (ostatni mecz) ----------
function wireHeat(d) {
  const box = $("#hm"); if (!box || !d.lastMatch) return;
  box.innerHTML = `<h3>Heatmapa zawodnika – ostatni mecz</h3><button class="btn" id="hl">Wybierz zawodnika</button><div id="hb"></div>`;
  $("#hl").onclick = async () => {
    $("#hl").disabled = true;
    try {
      const lu = await api(`/api/event/${d.lastMatch.id}/lineups`);
      const side = d.lastMatch.homeTeamId === d.team.id ? lu.home : lu.away;
      const pl = (side?.players || []).filter((p) => !p.substitute);
      $("#hb").innerHTML = `<div class="row2" style="margin-top:10px"><select id="hp">${pl.map((p) =>
        `<option value="${p.player.id}">${p.shirtNumber ?? ""} ${esc(p.player.name)}</option>`).join("")}</select><button class="btn" id="hg">Pokaż</button></div><div id="hc"></div>`;
      $("#hg").onclick = () => drawHeat(d.lastMatch.id, $("#hp").value);
    } catch (e) { $("#hb").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
    finally { $("#hl").style.display = "none"; }
  };
}
async function drawHeat(eventId, playerId) {
  const c = $("#hc"); c.innerHTML = `<p class="mut">Ładowanie…</p>`;
  try {
    const d = await api(`/api/heatmap/${eventId}/${playerId}`);
    const pts = (d.heatmap || []).filter((p) => typeof p.x === "number" && typeof p.y === "number");
    if (!pts.length) { c.innerHTML = `<p class="mut">Brak danych heatmapy dla tego zawodnika w tym meczu.</p>`; return; }
    c.innerHTML = `<canvas class="pitch" id="cv" width="630" height="408"></canvas><div class="mut" style="font-size:12px">Kierunek ataku: w prawo</div>`;
    const cv = $("#cv"), g = cv.getContext("2d"), W = cv.width, H = cv.height;
    g.fillStyle = "#14532d"; g.fillRect(0, 0, W, H);
    g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 2; g.strokeRect(10, 10, W - 20, H - 20);
    g.beginPath(); g.moveTo(W / 2, 10); g.lineTo(W / 2, H - 10); g.stroke();
    g.beginPath(); g.arc(W / 2, H / 2, 50, 0, 7); g.stroke();
    for (const s of [10, W - 10]) { const dir = s < W / 2 ? 1 : -1; g.strokeRect(dir > 0 ? s : s - 100, H / 2 - 100, 100, 200); g.strokeRect(dir > 0 ? s : s - 36, H / 2 - 45, 36, 90); }
    for (const p of pts) {
      const x = 10 + (p.x / 100) * (W - 20), y = 10 + (p.y / 100) * (H - 20);
      const gr = g.createRadialGradient(x, y, 0, x, y, 34);
      gr.addColorStop(0, "rgba(255,70,0,.14)"); gr.addColorStop(1, "rgba(255,70,0,0)");
      g.fillStyle = gr; g.fillRect(x - 34, y - 34, 68, 68);
    }
  } catch (e) { c.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

// ---------- Drużyny ----------
const mlnE = (v) => v == null ? "–" : v >= 1e6 ? (Math.round(v / 1e5) / 10) + " mln €" : Math.round(v / 1e3) + " tys. €";
async function showTeams() {
  loading();
  try {
    const rows = (await api("/api/table")).standings[0].rows.filter((r) => String(r.team.id).startsWith("tm-"));
    if (!rows.length) { app.innerHTML = `<p class="mut">Strony drużyn są dostępne, gdy działa źródło Transfermarkt.</p>`; return; }
    app.innerHTML = rows.map((r) => `<div class="m" data-tid="${r.team.id}" style="grid-template-columns:30px 1fr auto"><div class="tm">${r.position}.</div><div>${esc(r.team.name)}</div><div class="sc">${r.points} pkt</div></div>`).join("");
    document.querySelectorAll(".m").forEach((el) => el.onclick = () => openTeam(el.dataset.tid));
  } catch (e) { fail(e); }
}
async function openTeam(id) {
  view = "teams"; clearInterval(timer); timer = null;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === "teams"));
  loading("Ładowanie drużyny… (pierwsze wejście może potrwać kilka sekund)"); window.scrollTo({ top: 0 });
  try {
    const d = await api(`/api/team/${id}`), t = d.table;
    const groups = {}; for (const p of d.squad) (groups[p.position] ||= []).push(p);
    const order = ["Bramkarze", "Obrońcy", "Pomocnicy", "Napastnicy", "Inni"];
    let h = note(d) + `<button class="btn back" id="bk">‹ Wróć</button><div class="panel">
      <div style="font-size:20px;font-weight:700">${esc(d.team.name)}</div>
      <div class="mut" style="font-size:13px;margin-top:4px">${t.position}. miejsce · ${t.points} pkt · ${t.matches} mecze · bilans ${t.wins}-${t.draws}-${t.losses} · bramki ${t.scoresFor}:${t.scoresAgainst}</div>
      <div class="mut" style="font-size:13px;margin-top:2px">${[d.coach && "Trener: " + esc(d.coach), d.stadium?.name && "Stadion: " + esc(d.stadium.name) + (d.stadium.capacity ? " (" + d.stadium.capacity.toLocaleString("pl-PL") + " miejsc)" : ""), "Wartość kadry: " + mlnE(d.squadValue)].filter(Boolean).join(" · ")}</div>
      <h3>Forma (od najstarszego)</h3><div class="chips">${[...d.form].reverse().map((m) => `<div class="chip ${m.res}" title="${esc(m.opponent)} ${m.gf}:${m.ga}">${m.res}</div>`).join("")}</div>
      <div class="mut" style="font-size:12px">${[...d.form].reverse().map((m) => `${m.home ? "d" : "w"} ${esc(m.opponent)} ${m.gf}:${m.ga}`).join(" · ")}</div>`;
    if (d.next) h += `<div class="nm">Następny mecz: <b>${d.next.home ? esc(d.team.name) : esc(d.next.opponent)} – ${d.next.home ? esc(d.next.opponent) : esc(d.team.name)}</b><br>
      <span class="mut">kolejka ${d.next.round ?? "?"} · ${esc(fmtDay(d.next.date))} ${fmtTime(d.next.date)}</span>
      ${d.h2h.length ? `<br><span class="mut">W tym sezonie: ${d.h2h.map(esc).join("; ")}</span>` : `<br><span class="mut">W tym sezonie jeszcze się nie spotkały.</span>`}</div>`;
    h += `<button class="btn" id="aiq">🤖 Analiza AI tej drużyny</button>`;
    if (d.unavailable.length) h += `<h3>Niedostępni</h3>` + d.unavailable.map((u) => `<div style="font-size:14px;padding:3px 0"><span class="tag ${u.type === "zawieszenie" ? "s" : ""}">${u.type}</span>${esc(u.name)} <span class="mut">– ${esc(u.reason)}${u.until ? ", do " + esc(u.until) : ", brak daty powrotu"}</span></div>`).join("");
    if (d.scorers.length) h += `<h3>Strzelcy w lidze</h3>` + d.scorers.map((s) => `<div class="pl" style="grid-template-columns:1fr auto"><div>${esc(s.name)}</div><div class="v">${s.goals} goli · ${s.assists} asyst</div></div>`).join("");
    for (const g of order) if (groups[g]) h += `<h3>${g}</h3>` + groups[g].map((p) => `<div class="pl"><div class="mut">${p.shirt ?? ""}</div><div>${esc(p.name)}${p.captain ? " ©" : ""} <span class="mut">${esc(p.age ? p.age + " l." : "")}</span></div><div class="v">${mlnE(p.value)}</div></div>`).join("");
    app.innerHTML = h + `</div><p class="mut" style="font-size:12px">Źródło: Transfermarkt (wartości rynkowe, kontuzje i zawieszenia sprawdzane dla 22 najcenniejszych zawodników).</p>`;
    $("#bk").onclick = () => go("teams");
    $("#aiq").onclick = () => { anTeam = id; go("ai"); setTimeout(() => $("#an") && runAnalysis(id), 50); };
  } catch (e) { fail(e); }
}

// ---------- Trafność typów AI ----------
async function showPred() {
  loading();
  try {
    const d = await api("/api/predictions"), s = d.summary, pct = (a, b) => b ? Math.round((a / b) * 100) + "%" : "–";
    const pk = { "1": "gospodarz", X: "remis", "2": "gość" };
    const row = (r, done) => `<div class="m" style="grid-template-columns:1fr auto;cursor:default">
      <div><div>${esc(r.home_name)} – ${esc(r.away_name)}</div><div class="mut" style="font-size:12px">kolejka ${r.round ?? "?"} · typ: ${pk[r.pick]} (${r.p_home}% / ${r.p_draw}% / ${r.p_away}%) · wynik ${esc(r.score_pred || "–")} · pewność: ${esc(r.confidence || "–")}</div></div>
      <div class="sc">${done ? `<div>${r.actual_home}:${r.actual_away}</div><div class="${r.outcome_ok ? "ok" : "bad"}">${r.outcome_ok ? "✓" : "✗"}${r.score_ok ? " ★" : ""}</div>` : `<div class="mut" style="font-weight:400;font-size:12px">${esc(fmtDay(r.match_ts))}</div>`}</div></div>`;
    app.innerHTML = `<div class="grid2"><div class="kpi"><span class="mut">Rozliczone typy</span><b>${s.n}</b></div>
      <div class="kpi"><span class="mut">Trafny zwycięzca / remis</span><b>${s.ok}/${s.n} · ${pct(s.ok, s.n)}</b></div>
      <div class="kpi"><span class="mut">Trafiony dokładny wynik ★</span><b>${s.exact}/${s.n} · ${pct(s.exact, s.n)}</b></div>
      <div class="kpi"><span class="mut">Wg pewności modelu</span><div style="font-size:13px;margin-top:4px">${d.byConfidence.length ? d.byConfidence.map((c) => `${esc(c.c || "?")}: ${c.ok}/${c.n}`).join("<br>") : "–"}</div></div></div>
      <h3>Nadchodzące typy</h3>${d.upcoming.length ? d.upcoming.map((r) => row(r, false)).join("") : `<p class="mut">Brak. Wygeneruj analizę drużyny w zakładce „Analiza AI” – typ następnego meczu zapisze się tu automatycznie.</p>`}
      <h3>Rozliczone</h3>${d.settled.length ? d.settled.map((r) => row(r, true)).join("") : `<p class="mut">Typy rozliczą się automatycznie po zakończeniu meczów.</p>`}
      <p class="mut" style="font-size:12px">Typ = najbardziej prawdopodobny wynik 1/X/2 z prognozy modelu. Zapisuje się ostatnia prognoza sprzed meczu.</p>`;
  } catch (e) { fail(e); }
}

function go(v) {
  view = v; clearInterval(timer); timer = null;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  if (v === "live") showLive();
  else if (v === "round") showRound();
  else if (v === "ai") showAnalysis();
  else if (v === "teams") showTeams();
  else if (v === "pred") showPred();
  else showTable();
}
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => go(b.dataset.v));
go("live");
</script>
</body>
